services:
  - type: web
    name: dev-support
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
